<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Markdown Recorder</title>
    <script type="module" crossorigin src="./assets/index-YVcNjlzX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CTdoj0cM.css">
  </head>
  <body>
    <main class="app">
      <h1>Voice Markdown Recorder</h1>
      <p id="status" class="status">初期化中...</p>

      <button id="recordButton" class="record-button" type="button" aria-label="押している間だけ録音">
        押している間だけ録音
      </button>

      <div class="actions">
        <button id="downloadButton" type="button">Markdownを保存</button>
      </div>

      <section class="preview-wrap">
        <h2>プレビュー</h2>
        <pre id="preview" class="preview"></pre>
      </section>
    </main>

  </body>
